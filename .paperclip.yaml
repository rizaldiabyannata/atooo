        body: "## Daftar Harga NTB-PL-2026-09 terbit — bertanggal 29 September 2026\n\n- Dokumen: [`pricelist`](/ATO/issues/ATO-6#document-pricelist)\n- Artifact: [Daftar Harga NTB-PL-2026-09 (29 September 2026)](/api/attachments/fa918547-0ae1-4e64-93ca-bfb1c3b2e88e/content)\n\nEnam bagian yang diminta ada semua: harga list Th1 + ASC dengan rincian komponen, 47 fitur dikelompokkan per fungsi bisnis, batas ruang lingkup, tiga tingkatan SLA, masa berlaku & indeksasi, dan pernyataan Program Mitra Riset 2026/2027 yang bertanggal dan tertutup. Nol angka khusus Pridata, nol angka Fase 2.\n\n---\n\n### Yang harus dicatat sebelum ini diterbitkan: jawaban Q1–Q5 sudah masuk, dan angkanya perlu diuji ulang\n\nKartu Q1–Q5 di [ATO-2](/ATO/issues/ATO-2) dijawab **28 September 2026, 06:55** — setelah Revisi 2 ATO-2 ditulis. Aturan keputusan Rani sendiri (Lampiran A.5) memberi dua arahan yang tampak bertabrakan, jadi saya hitung ulang, bukan menyalin:\n\n| | Jawaban | Arahan A.5 |\n|---|---|---|\n| **Q1** | **a** — ±6 bulan, 2 orang | \"Tidak ada perubahan harga. Terbitkan list Rp 175.000.000 seperti rencana.\" |\n| **Q2** | **c** — 3–4 pembeli | \"Harga list naik ke Rp 237.500.000 / Rp 195.500.000.\" |\n\nArahan Q2 itu dihitung pada **378 orang-hari**. Q1 = a berarti basisnya **252 orang-hari**, jadi angka 237,5/195,5 juta tidak berlaku. Perhitungan ulang dengan rumus yang sama (Lampiran A.1):\n\n```\nbiaya bangun = 252 od × Rp 950.000                  = Rp 239.400.000\nlisensi      = (biaya bangun ÷ n pembeli) × 1,40\nharga list   = lisensi + Rp 70.000.000 (implementasi 40 od)\n```\n\n| n pembeli (Q2 = 3–4) | Amortisasi/pembeli | Lisensi | **Harga list Th1** |\n|---:|---:|---:|---:|\n| 3 | Rp 79.800.000 | Rp 111.500.000 | **Rp 181.500.000** |\n| 4 | Rp 59.850.000 | Rp 84.000.000 | **Rp 154.000.000** |\n\n**Rp 175.000.000 berada di dalam rentang Rp 154.000.000 – Rp 181.500.000, dekat ujung konservatif (3 pembeli).** Jadi harga list tidak saya ubah — dan sekarang alasannya tertulis, bukan warisan asumsi. Q4 = d (Pridata pernah melihat SAP B1 / Odoo berbayar) menambah dukungan: jangkar pembanding di kepala mereka tinggi, bukan rendah.\n\nASC tidak tersentuh Q1 maupun Q2 — lama pembangunan tidak masuk ke satu pun komponen biaya tahunan (A.4).\n\n### Yang saya tambahkan atau kurangi dari ATO-2, dengan alasannya\n\n| # | Perubahan | Alasan |\n|---|---|---|\n| 1 | **§4.1 varian ASC tanpa hosting terkelola** diterbitkan: Dasar Rp 27.500.000, Standar Rp 51.500.000, Prioritas Rp 72.500.000/th | Q5 dijawab \"kami yang mengelola, tetapi VPS milik mereka\". Komponen hosting Rp 26.500.000/th sudah ada di ATO-2 §6.2; dua tingkat lain adalah pengurangan yang sama. Diterbitkan supaya kesepakatan tanpa-hosting pertama punya jangkar list, bukan angka dadakan yang dibuat saat negosiasi. |\n| 2 | **Persentase diskon 50% tidak dicantumkan** | Ring-fence #3: yang boleh publik hanya harga list. Menerbitkan \"50%\" di dokumen publik membuat 50% jadi ekspektasi seluruh NTB — persis kontaminasi yang dicegah klausul #1. Di dokumen ini tertulis bahwa besaran potongan tidak dipublikasikan dan setara nilai kewajiban timbal balik. Ring-fence #2 (50% sebagai baris terpisah) tetap berlaku di dalam kontrak Pridata. |\n| 3 | **Opsi C (kemitraan 5 tahun) tidak diterbitkan** | Rani merekomendasikan menolaknya (§4). Menerbitkannya berarti menawarkan skema yang tidak mau kita jual. |\n| 4 | **47 fitur dikelompokkan ulang per fungsi bisnis** (8 kelompok), bukan per tingkat kesulitan | Diminta tugas ini. Easy/Mid/High/Advance adalah bahasa penetapan biaya internal — tidak boleh muncul di dokumen pelanggan. Jumlah tetap 47, tiap fitur muncul persis sekali. |\n| 5 | **Ketentuan komersial standar ditambahkan**: PPN eksklusif, penawaran berlaku 30 hari, jatuh tempo 14 hari, indeksasi diberitahukan 60 hari di muka, penurunan tingkat SLA hanya saat perpanjangan | Tidak ada di ATO-2 dan tidak mengubah satu pun harga, tetapi price list tanpa ini tidak bisa dipakai di proposal. Butuh konfirmasi user (lihat kartu). |\n\n### Satu temuan yang lebih besar dari tugas ini — Q3\n\n**Q3 dijawab \"2 miliar\".** Seluruh model nilai ATO-2 berdiri di atas profil pembeli omzet **Rp 40 miliar**, persediaan Rp 3 miliar, piutang Rp 4 miliar. Kalau Rp 2 miliar itu omzet tahunan Pridata, plafon nilai mereka runtuh ke kisaran satuan juta per tahun dan **tidak ada** struktur harga di ATO-2 — termasuk harga mitra riset — yang bisa dibenarkan dari sisi nilai pembeli.\n\nIni **tidak** menurunkan harga list. Aturan Rani di §3.4 eksplisit: untuk pembeli yang lebih kecil, jawabannya adalah Opsi B (langganan), bukan menurunkan list — karena menurunkan list merusak jangkar diskon. Jadi dokumen ini tetap berdiri, dan Opsi B sudah ikut diterbitkan di §1.2.\n\nTetapi ini menyentuh langsung [ATO-4](/ATO/issues/ATO-4) dan [ATO-5](/ATO/issues/ATO-5). Saya perlu tahu dulu apakah \"2 miliar\" itu omzet per tahun, per bulan, atau angka lain, sebelum penawaran Pridata disusun di atasnya. Pertanyaan itu ada di kartu.\n\n### Status\n\nPenerbitan ke situs dan materi penjualan adalah keputusan user. Kartu persetujuan sudah dibuat; issue saya set ke `in_review`.\n"
