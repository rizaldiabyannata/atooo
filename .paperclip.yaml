        authorAgentSlug: "ace"
        authorType: "agent"
        body: "## Sudah — isinya selesai kemarin, statusnya yang ketinggalan. Saya tutup barusan.\n\n[ATO-2](/ATO/issues/ATO-2) sekarang `done`. Analisisnya sudah terbit Revisi 3 ([analysis](/ATO/issues/ATO-2#document-analysis)) dengan seluruh jawaban kalian (Q1–Q5) masuk ke angka. Yang bikin dia nyangkut di `in_progress`: run Rani kehilangan ikatan tugasnya setelah reconnect koneksi AI, jadi komentar penutup dan perubahan statusnya kena `403`. Laporannya dia selamatkan sebagai dokumen ([closing-report](/ATO/issues/ATO-2#document-closing-report)) — tidak ada analisis yang hilang.\n\n**Efeknya langsung:** [ATO-4](/ATO/issues/ATO-4) (skema penjualan) ikut lepas dari blokir dan sudah jalan di tangan Rani.\n\n## Angka yang keluar dari ATO-2\n\n| | |\n|---|---:|\n| Biaya bangun (6 bln × 2 org = 252 orang-hari) | Rp 239.400.000 |\n| Harga list Tahun 1 | Rp 175.000.000 |\n| ASC Dasar / tahun | Rp 27.500.000 |\n| **Pridata — sistem (−50%)** | **Rp 87.500.000** |\n| **Pridata — ASC** | **Rp 27.500.000/th, diskon 0%** |\n| Lantai walk-away Tahun 1 | Rp 104.000.000 |\n| Pembeli tambahan untuk memulihkan biaya bangun | 2 (kalian bilang tersedia 3–4) |\n\nDua hal dari Rani yang perlu kalian tahu sekarang, bukan nanti:\n\n1. **Diskon ASC dibatalkan jadi 0%.** Pada diskon 25% kita rugi Rp 7,9 juta/tahun dari Pridata. Gantinya konsesi satu kali senilai Rp 26.575.000 (garansi 6 bulan, bank 10 orang-hari change request, ASC terkunci tanpa indeksasi) — yang bisa ditarik kembali di meja negosiasi, tidak seperti potongan berulang.\n2. **Bobot effort di revisi awal kelebihan 53,6%.** Kalau dipakai untuk menghitung Fase 2, harganya jadi melebihi 53,6%. Kalibrasinya sudah saya catat untuk Bayu.\n\n## Yang sekarang berhenti di kalian, bukan di kami\n\nSatu kartu menunggu di [ATO-6](/ATO/issues/ATO-6): **izin menerbitkan Daftar Harga NTB-PL-2026-09**. Ini prasyarat — kalau harga list Rp 175 juta tidak terbit dan bertanggal lebih dulu, Rp 87,5 juta ke Pridata bukan diskon, itu cuma harga.\n\nDi kartu yang sama ada pertanyaan yang paling menentukan: **\"2 miliar\" yang kalian isi untuk skala Pridata itu per tahun atau per bulan?** Rani memodelkan keduanya dan memakai Rp 24 miliar/tahun sebagai asumsi kerja. Harganya tidak berubah apa pun jawabannya — yang berubah satu hal: kalau benar Rp 2 miliar/tahun, biaya berjalan jadi 2,4% dari omzet mereka dan **komitmen ASC 3 tahun tidak boleh diminta**. Itu perlu dipastikan sebelum tanda tangan, bukan sebelum kirim harga.\n\nTugas ini tetap `blocked` menunggu [ATO-5](/ATO/issues/ATO-5). Tidak ada yang dikirim ke Pridata sebelum kalian tinjau."
