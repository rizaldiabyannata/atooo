        body: "## Diterbitkan. Daftar Harga NTB-PL-2026-09 sekarang terikat ke template proposal standar\n\nKeempat jawaban Anda sudah dijalankan.\n\n| Keputusan Anda | Yang saya lakukan |\n|---|---|\n| Terbitkan apa adanya | [`pricelist`](/ATO/issues/ATO-6#document-pricelist) tidak saya sentuh — nol perubahan angka, nol perubahan teks |\n| Kanal: template proposal standar | Dibuat [`proposal-template`](/ATO/issues/ATO-6#document-proposal-template) — **PROP-TPL-NTB-2026-09**, bertanggal 29 September 2026, terikat pada NTB-PL-2026-09 · [artifact](/api/attachments/a3b62a76-9e58-4226-855d-80964d909ad0/content) |\n| Ketentuan komersial sudah benar | Masuk ke template tanpa perubahan |\n| Q3 = omzet ± Rp 2 miliar/tahun | Diteruskan ke [ATO-4](/ATO/issues/ATO-4) dengan aritmetikanya — lihat bagian terakhir, ini yang paling perlu perhatian Anda |\n\n### Apa yang template itu kunci\n\nTemplate proposal punya satu halaman aturan pengisian internal (dihapus sebelum dikirim) yang mengunci empat hal supaya jangkar harga tidak bisa bocor karena kelalaian saat menyusun penawaran:\n\n1. **Setiap proposal wajib melampirkan NTB-PL-2026-09 utuh** sebagai Lampiran 2. Proposal tanpa lampiran itu tidak boleh dikirim — lampiran itulah bukti bertanggal yang bisa diperiksa pembeli.\n2. **Persentase potongan tidak pernah ditulis.** Potongan mitra riset muncul sebagai baris rupiah terpisah di bawah harga list yang tertulis penuh (§3.3). Ring-fence #2 jadi bagian dari borang, bukan sekadar niat.\n3. **Tidak ada angka Fase 2.** Modul penerimaan barang tahap lanjut disebut sebagai item terpisah tanpa harga, dan tidak boleh dijanjikan gratis.\n4. **Syarat komersial satu mitra tidak boleh pindah ke proposal pembeli lain.**\n\nIsinya: ringkasan untuk pemilik usaha, isi paket 47 fitur, harga (Opsi A / Opsi B / blok mitra riset), batas ruang lingkup + kewajiban data master, tingkatan SLA termasuk varian tanpa hosting terkelola, termin pembayaran per milestone, masa berlaku & indeksasi, langkah setelah tanda tangan. Semua angka identik dengan NTB-PL-2026-09.\n\n### Satu catatan tentang kanal yang lebih sempit\n\nRing-fence #1 menyebut tiga kanal: proposal standar, materi penjualan, dan situs. Anda memilih proposal standar saja. Itu cukup untuk memenuhi fungsi klausulnya — list terbit lebih dulu, bertanggal, dan pembeli melihatnya sebagai dokumen bernomor, bukan sebagai angka yang muncul saat negosiasi — **dengan satu syarat: setiap proposal NTB memakai template ini, termasuk proposal Pridata.**\n\nYang hilang dari pilihan ini: list tidak bisa diverifikasi oleh pihak yang belum menerima proposal. Kalau distributor NTB kedua nanti membandingkan catatan dengan Pridata, list yang publik akan lebih kuat. Tidak perlu diputuskan sekarang — memasangnya di situs nanti tidak menerbitkan dokumen baru, nomor dan tanggalnya tetap NTB-PL-2026-09.\n\n### Yang perlu perhatian Anda: Q3 mengubah dasar penawaran Pridata\n\nOmzet **Rp 2 miliar per tahun** dua puluh kali lebih kecil dari profil pembeli yang dipakai Rani menyusun seluruh argumen nilai di ATO-2 (omzet Rp 40 miliar, persediaan Rp 3 miliar, piutang Rp 4 miliar). Harga list tidak berubah karenanya — aturan Rani sendiri melarang menurunkan list untuk pembeli lebih kecil, karena itu merusak jangkar diskon. Tapi angkanya perlu Anda lihat:\n\n| | Nilai | Terhadap omzet Rp 2 miliar/th |\n|---|---:|---:|\n| Opsi A, kas Tahun 1 | Rp 215.500.000 | **10,8%** |\n| Opsi B, kas Tahun 1 | Rp 156.000.000 | 7,8% |\n| Opsi B, langganan bulanan | Rp 9.250.000/bln | 5,6% dari omzet bulanan |\n\nDengan marjin kotor distributor yang lazim 10–15%, laba kotor tahunan Pridata ada di kisaran Rp 200–300 juta. Harga list Tahun 1 Opsi A mendekati **satu tahun penuh laba kotor mereka**. Bahkan setelah potongan 50%, Th1 ≈ Rp 87.500.000 + ASC masih sepertiga sampai separuh laba kotor tahunan.\n\nSaya sudah menaruh ini di [ATO-4](/ATO/issues/ATO-4) sebagai input wajib, dengan instruksi eksplisit ke Rani: hitung ulang bagian nilai pada profil Rp 2 miliar, dan kalau ternyata tidak ada satu pun struktur di daftar harga yang bisa dibayar Pridata, **tulis kesimpulan itu apa adanya** alih-alih mengarang struktur baru. Keputusan komersialnya milik Anda, tapi Anda perlu angka yang jujur dulu — dan itu keluar dari ATO-4, bukan dari tugas ini.\n\n### Status\n\nATO-6 selesai. Prasyarat ring-fence #1 terpenuhi: harga list terbit dan bertanggal sebelum penawaran Pridata disusun. Yang berjalan sekarang ATO-4 (Rani), lalu ATO-5.\n"
