        body: "## Input wajib untuk ATO-4 — skala Pridata sudah dikonfirmasi user: omzet ± Rp 2 miliar **per tahun**\n\nDua hal dari [ATO-6](/ATO/issues/ATO-6) yang mengikat tugas ini. Keduanya keputusan user tanggal 29 September 2026, bukan usulan saya.\n\n### 1. Harga list sudah terbit dan bertanggal — jangan diubah, jangan dipotong di luar program\n\nDaftar Harga **NTB-PL-2026-09**, terbit **29 September 2026**, berlaku sampai 30 Juni 2027, sudah disetujui user untuk diterbitkan apa adanya dan sudah terikat ke [template proposal standar](/ATO/issues/ATO-6#document-proposal-template) (`PROP-TPL-NTB-2026-09`). Ring-fence #1 terpenuhi: list ada lebih dulu dan bertanggal.\n\nAngka yang mengikat: Th1 **Rp 175.000.000** (lisensi Rp 105.000.000 + implementasi Rp 70.000.000), ASC Dasar **Rp 54.000.000/th** (Th1 pro rata 9 bln Rp 40.500.000), Standar Rp 78.000.000, Prioritas Rp 99.000.000. Opsi B: aktivasi Rp 45.000.000 + Rp 9.250.000/bulan. Rate di luar lingkup Rp 1.750.000/orang-hari. **Varian ASC tanpa hosting terkelola** (server milik pembeli) sudah ikut terbit: Dasar Rp 27.500.000, Standar Rp 51.500.000, Prioritas Rp 72.500.000/th — dipakai kalau Q5 (\"kami kelola, VPS milik mereka\") jadi bentuk akhirnya.\n\nJawaban Q1–Q5 sudah saya olah di ATO-6. Ringkasnya: Q1 = a (±6 bulan, 2 orang) berarti basisnya **252 orang-hari**, bukan 378, jadi arahan A.5 untuk Q2 = c (naikkan ke Rp 237.500.000) dihitung pada basis yang salah. Perhitungan ulang dengan rumus A.1 pada 252 od menghasilkan rentang **Rp 154.000.000 – Rp 181.500.000** untuk 3–4 pembeli. Rp 175.000.000 ada di dalam rentang itu, dekat ujung konservatif. Harga list tidak berubah.\n\n### 2. Q3 = **omzet ± Rp 2 miliar per tahun** — ini membatalkan dasar nilai di ATO-2\n\nSeluruh argumen nilai di ATO-2 berdiri pada profil pembeli **omzet Rp 40 miliar**, persediaan Rp 3 miliar, piutang Rp 4 miliar. User mengonfirmasi angka Pridata adalah **± Rp 2 miliar omzet per tahun** — dua puluh kali lebih kecil.\n\nKonsekuensi aritmetiknya harus masuk ke dokumen ATO-4, bukan dilewati:\n\n| | Nilai | Terhadap omzet Rp 2 miliar/th |\n|---|---:|---:|\n| Opsi A, kas Tahun 1 (Rp 175 jt + ASC pro rata Rp 40,5 jt) | Rp 215.500.000 | **10,8%** |\n| Opsi B, kas Tahun 1 | Rp 156.000.000 | 7,8% |\n| Opsi B, langganan bulanan | Rp 9.250.000/bln | **5,6% dari omzet bulanan** |\n\nUntuk distributor dengan marjin kotor lazim 10–15%, laba kotor tahunan Pridata ada di kisaran Rp 200–300 juta. Artinya harga list Tahun 1 Opsi A mendekati **satu tahun penuh laba kotor** mereka. Bahkan setelah potongan mitra riset 50%, Th1 ≈ Rp 87.500.000 + ASC masih di kisaran sepertiga sampai separuh laba kotor tahunan.\n\n**Yang saya minta kamu kerjakan di ATO-4, bukan saya putuskan sendiri:**\n\n1. Hitung ulang bagian nilai/ROI pada profil Rp 2 miliar/tahun. Kalau angka penghematan yang bisa dipertahankan ternyata lebih kecil dari biaya sistem, **tulis itu apa adanya** — jangan tahan rekomendasi hanya karena angkanya tidak enak. Penawaran ATO-5 berdiri di atas bagian ini.\n2. Aturanmu sendiri di §3.4 berlaku: pembeli lebih kecil dijawab dengan **Opsi B**, bukan dengan menurunkan list. Uji apakah Opsi B + potongan mitra riset memang bisa dibayar pada skala ini, dan tunjukkan angkanya per bulan, bukan per tahun.\n3. Kalau setelah dihitung tidak ada satu pun struktur di NTB-PL-2026-09 yang bisa dibayar Pridata, kesimpulan itu sendiri adalah deliverable yang valid — sebutkan eksplisit, beserta apa yang berubah untuk ATO-5. Jangan mengarang struktur harga baru di luar daftar harga yang sudah terbit.\n4. Q4 = d (Pridata pernah melihat SAP B1 / Odoo berbayar) tetap berlaku sebagai jangkar pembanding yang tinggi di sisi persepsi — tapi jangan pakai itu untuk menutupi hasil hitungan poin 1.\n\n### Batasan yang tidak boleh dilanggar di ATO-4\n\n- Jangan menurunkan harga list. Potongan hanya lewat Program Mitra Riset, selalu sebagai **baris rupiah terpisah** atas harga list.\n- Jangan menuliskan persentase potongan di materi apa pun yang keluar dari kantor. Di dokumen internal ATO-4 boleh; di proposal tidak.\n- Jangan mencantumkan harga Fase 2 (modul penerimaan barang tahap lanjut) — belum diestimasi.\n"
