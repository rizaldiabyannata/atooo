        body: "## Selesai — diagnosis terverifikasi, spesifikasi Fase 2 siap\n\nDokumen: [ATO-3 › analysis](/ATO/issues/ATO-3#document-analysis)\n\n**Akar masalah (satu kalimat):** Sistem tidak punya dokumen ekspektasi apa pun untuk barang masuk — tidak ada PO ke supplier dan tidak ada header penerimaan yang tersimpan di database — sehingga angka yang diketik operator tidak pernah dibandingkan dengan angka manapun, dan satu-satunya deteksi selisih yang ada (`ReconciliationSession`, `prisma/schema.prisma:919-954`) baru bekerja saat stock opname.\n\n**Hipotesismu terbukti: ini masalah dokumen yang hilang, bukan masalah form.** Bukti paling telak justru ada di kode FE sekarang — validasi `qtyGood + qtyDamaged === qtyReceived` (`app/(dashboard)/gudang/penerimaan-barang/input/page.tsx:202-205`) adalah persis \"validasi form tanpa dokumen\": ia hanya mencocokkan ketikan operator dengan ketikan operator itu sendiri.\n\n### Verifikasi 8 poin\n\nPoin 1, 2, 3, 4, 5, 6 **benar**. Dua poin perlu dikoreksi, dan keduanya penting:\n\n- **Poin 7 sebagian keliru.** `Product.unit` **ada** (`prisma/schema.prisma:200`, \"Satuan, mis. Pcs / Set / Meter\"). Yang tidak ada adalah faktor konversi. Kesimpulanmu tetap benar, alasannya yang harus diperbaiki.\n- **Poin 8 campuran.** `AuditLog` **memang menangkap** pembuatan penerimaan lengkap dengan aktor (`src/controllers/stockAdjustment.controller.ts:44-68`) — jadi bagian ini keliru. **Tapi ada lubang yang lebih serius dan belum kita sadari: `update` tidak diaudit sama sekali** (`:155-162`), padahal ia benar-benar menulis ulang stok (`src/repositories/stockAdjustment.repository.ts:244-314`). Seseorang bisa mengubah kuantitas penerimaan yang sudah tercatat, tanpa alasan wajib dan tanpa jejak apa pun.\n\n### Tiga temuan tambahan di luar 8 poin\n\n1. **`supplierId` bukan sekadar opsional — UI penerimaan tidak pernah mengirimkannya** (`.../input/page.tsx:226-243`). Nama supplier hanya teks bebas yang dijejalkan ke `reason`. Relasi Supplier↔penerimaan praktis kosong 100%.\n2. **\"Header\" penerimaan sebenarnya ada, tapi hanya sebagai JSON yang di-serialize ke kolom teks `reason`** dan di-parse ulang di browser (`FE_Pridata_Jaya/services/warehouse-receipts.ts:42-78`). Backend tidak tahu dokumen itu ada. Bila nama supplier mengandung karakter `}`, parse gagal dan penerimaan itu **lenyap dari layar riwayat** sementara stoknya tetap masuk (`:54`, `:94`).\n3. **Surat jalan 40 baris = 40–80 request HTTP terpisah, masing-masing transaksi sendiri** (`.../input/page.tsx:221-248`). Tidak ada atomisitas dan tidak ada idempotency: gagal di tengah meninggalkan stok separuh terposting, dan menekan Simpan lagi menggandakan baris yang sudah sukses.\n\n### Apa yang software bisa dan tidak bisa\n\n**Bisa:** memindahkan waktu penemuan selisih dari \"saat opname bulanan\" ke \"saat truk supplier masih di depan gudang\"; menghilangkan salah identifikasi produk lewat scan; memberi setiap perubahan stok pelaku, waktu, alasan, dan dokumen induk.\n\n**Tidak bisa:** menghilangkan salah hitung fisik (11 vs 12 karton tetap lolos bila angkanya kebetulan cocok); mengatasi kekurangan orang di jam puncak bongkar muat; menciptakan budaya PO yang tidak ada; membuat orang membaca jejak audit. **Saya tidak menuliskan janji \"menghilangkan human error\" di mana pun** — dan menolak memberi angka persentase untuk penurunan selisih opname, karena selisih opname punya banyak sebab dan Fase 2 hanya menyentuh satu.\n\n### Effort\n\n- **Paket inti (F2-6, F2-1, F2-2, F2-3, F2-4, F2-5): 27–48 hari-orang** — ini yang benar-benar menjawab keluhan.\n- Inti + barcode: 35–62 hari-orang.\n- Seluruh item termasuk UOM & batch: 58–101 hari-orang — **tidak saya anjurkan dijual sebagai satu fase.**\n\nSemuanya rentang, bukan titik. Ini effort, bukan harga — penetapan harga milik Rani.\n\n### Item paling berisiko\n\n**F2-8 (UOM & konversi karton↔pcs), 12–20 hari.** Blast radius tertinggi: `quantity` bertipe `Int` polos tersebar di seluruh sistem (`WarehouseInventory`, `StockAdjustment`, `OrderItem`, `InvoiceItem`, `DeliveryOrderItem`, `SalesReturnItem`, `ReconciliationItem`, seluruh laporan, modul KPI). Satu pembaca terlewat = kesalahan stok senyap 24×, lebih buruk dari masalah yang sedang diperbaiki. **Rekomendasi: pisahkan jadi fase tersendiri.** F2-10 (batch/expiry) setara risikonya dan saya anjurkan **digugurkan** kecuali Pridata punya produk kedaluwarsa.\n\n**Rekomendasi kerjakan duluan: F2-6 (aktor + tambal audit pengubahan), 2–4 hari.** Nilai tertinggi per hari kerja dan satu-satunya item tanpa prasyarat.\n\n### Dua catatan yang memengaruhi penawaran\n\n- **F2-1 mewajibkan migrasi data produksi** (backfill blob `[WAREHOUSE_RECEIPT]` jadi tabel betulan). Sudah masuk estimasi, tidak saya sembunyikan.\n- **F2-5 mengubah *kapan* stok bertambah** — dokumen menunggu approval berarti barang belum bisa dijual. Ini konsekuensi proses bisnis yang harus disepakati Pridata di muka, bukan detail teknis.\n\n### Perlu jawaban pelanggan — kamu yang pegang komunikasinya\n\nDeliverable tidak saya hentikan karena ini, tapi **Q1 bisa mengubah rancangan secara mendasar**:\n\n1. ⚠️ **Apakah Pridata membuat PO resmi ke supplier, atau memesan lewat telepon/WhatsApp?** Bila tidak ada PO, F2-2 menghasilkan tabel kosong dan rancangan harus berubah jadi **pencocokan 2 arah** (surat jalan sebagai dokumen ekspektasi). Tetap menutup akar masalah, dan **lebih murah 6–10 hari**.\n2. Berapa penerimaan per hari dan berapa baris per surat jalan?\n3. Apakah barang berbarcode, konsisten antar supplier? (menentukan target 70% input tanpa ketik)\n4. Ada produk dengan tanggal kedaluwarsa? (menggugurkan atau mewajibkan F2-10)\n5. Berapa orang di jam puncak, ada supervisor di lokasi? (menentukan F2-5 bisa diadopsi atau akan diakali)\n6. **Seberapa sering stock opname sekarang?** — dibutuhkan untuk baseline target utama yang akan kita janjikan.\n7. Barang diterima per karton lalu dijual per pcs?\n\n### Langkah berikutnya\n\n- **Ace** — jawaban Q1–Q7 ke pelanggan, lalu putuskan lingkup yang dibawa ke penawaran.\n- **Rani** — konversi rentang effort ke harga; premi risiko untuk F2-8/F2-10. Bila lingkup dipotong, urutan saya: pertahankan F2-6 → F2-1 → F2-3 → F2-4.\n- Poin 1–3 di §10 dokumen (audit pengubahan hilang, audit best-effort di luar transaksi, parse gagal menyembunyikan penerimaan) sebaiknya diperbaiki **terlepas dari apakah Fase 2 jadi dijual**.\n"
