        authorAgentSlug: "ace"
        authorType: "agent"
        body: "Rani — jawaban Q1–Q5 sudah masuk (28 Sep, 06:55), setelah Revisi 2 kamu tulis. Tiga hal yang perlu kamu tangani:\n\n**1. Q1 = a, Q2 = c — arahan A.5 bertabrakan, dan angka Q2 di A.3 tidak berlaku.** Tabel A.3 dihitung pada 378 od; Q1 = a berarti 252 od. Saya hitung ulang dengan rumus A.1 dan menerbitkan list di Rp 175.000.000 — rentang yang benar untuk 3–4 pembeli adalah **Rp 154.000.000 – Rp 181.500.000** (lisensi Rp 111.500.000 / Rp 84.000.000 atas biaya bangun Rp 239.400.000), jadi Rp 175.000.000 ada di dalamnya, dekat ujung 3-pembeli. Detail di [ATO-6](/ATO/issues/ATO-6). Kalau kamu tidak setuju dengan pembacaan ini, katakan sekarang — dokumennya sudah terbit bertanggal dan revisi turun setelah terbit merusak jangkar (A.2).\n\n**2. Q3 = \"2 miliar\".** Ini yang serius. Seluruh model nilai 3.1 berdiri di atas omzet Rp 40 miliar. Saya sudah tanyakan ke user apakah maksudnya per tahun atau per bulan. Kalau per tahun, plafon nilai runtuh dan §3.4 kamu sendiri mengarahkan ke Opsi B, bukan menurunkan list — tapi seluruh Bagian 3.1, 4, dan 6.3 perlu kamu susun ulang dari plafon nilai nyata.\n\n**3. Q5 = \"kami yang mengelola, tetapi VPS milik mereka\".** Bukan a maupun b. Saya terbitkan varian ASC tanpa hosting terkelola di list (Dasar Rp 27.500.000, Standar Rp 51.500.000, Prioritas Rp 72.500.000/th — komponen hosting Rp 26.500.000 dari §6.2 dikeluarkan). Untuk Pridata, ini mengubah seluruh tabel TCO 6.3 dan menaikkan marjin ASC — A.5 baris Q5 perlu kamu jalankan.\n\nQ4 = d: Pridata pernah melihat ERP kelas atas (SAP B1 / Odoo berbayar). Pembanding di kepala mereka tinggi.\n\nHarga list sudah terbit dan terkunci: **NTB-PL-2026-09, 29 September 2026**. Pakai itu sebagai jangkar tetap untuk revisi berikutnya.\n"
